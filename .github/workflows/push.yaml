name: Push Request Tests

on:
  push_request:
    branches:
      - main
     
jobs:
  codeceptjs-tests:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run CodeceptJS Tests
        run: npx codeceptjs run --steps

      - name: List files
        if: always()
        run: |
          echo "Diretório atual:"
          pwd

          echo "Arquivos do projeto:"
          ls -la

          echo "Estrutura completa:"
          find .

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeceptjs-report
          path: output/
          retention-days: 3